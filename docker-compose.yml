# -----------------------------------------------------------------------------
# Single-agent topology. Squid and the whole external-proxy apparatus are gone:
# outbound policy is now enforced INSIDE the work container by pi-sandbox
# (carderne/pi-sandbox), which wraps every Bash tool invocation in a bubblewrap
# sandbox with its own network namespace whose only exit is a policy proxy.
# Domains in config/sandbox.json pass silently; a domain that is not listed is
# denied outright (pi-sandbox starts the runtime without a per-connection
# callback). The human-facing domain prompt is a static scan of the command
# text: a command naming an unlisted host prompts once before it runs, so
# hosts reached indirectly (redirects, IP literals, config files) never prompt
# and simply fail. pi-permission-system gates Pi's native file tools.
#
#   work        the agent. Non-root, no sudo, no CA machinery. Runs the Pi
#               process and the pi-sandbox policy proxies. Publishes the Pi Web
#               UI on the host loopback.
#   searxng     metasearch; does its own outbound searching.
#   llama-swap  optional local model serving (profile: llama-swap).
#
# Trust note: network enforcement moved from "infrastructure the agent cannot
# bypass" (separate proxy pod, internal-only networks) to "extension that must
# be correctly loaded" (pi-sandbox). The Pi process itself is not OS-sandboxed;
# its fetches and model calls use `agent-net` directly. Keep `work` on no other
# networks, and treat the policy files under config/ as read-only inputs.
# -----------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------------------
  # work - the hardened pi sandbox
  # ---------------------------------------------------------------------------
  work:
    build:
      context: .
      dockerfile: Dockerfile
    image: work-sandbox:latest
    container_name: work

    networks:
      - agent-net

    depends_on:
      searxng:
        condition: service_started

    # -- volumes --------------------------------------------------------------
    volumes:
      # Persistent workspace shared with the host. This is the agent's
      # intentional writable blast radius.
      - type: bind
        source: ${WORKSPACE_DIR:-./agent-workspace}
        target: /workspace
      # Stable agent-writable temp space (pi-sandbox allowWrite entry /scratch).
      # tmpfs: nothing written here reaches disk, and it is empty on every
      # container start. Kubernetes equivalent: emptyDir { medium: Memory }.
      - type: tmpfs
        target: /scratch
        tmpfs:
          size: 1073741824
      # Pi global settings (all projects) - per pi.dev docs: ~/.pi/agent/settings.json
      - type: bind
        source: .pi/agent/settings.json
        target: /home/agent/.pi/agent/settings.json
      # Pi models configuration (llama-swap field mappings, etc.)
      - type: bind
        source: .pi/agent/models.json
        target: /home/agent/.pi/agent/models.json
      # Persistent pi session data (default Pi store path)
      - type: bind
        source: .pi/agent/sessions
        target: /home/agent/.pi/agent/sessions
      # Persistent scheduler state (separate from sessions)
      - type: bind
        source: .pi/scheduled
        target: /home/agent/.pi/scheduled
      # Pi Web state: projects list + session daemon socket
      - type: bind
        source: .pi/web
        target: /home/agent/.pi/web

    # -- ports ----------------------------------------------------------------
    # Bound to the host loopback by default: the Pi Web UI is reachable at
    # http://127.0.0.1:${PI_WEB_PORT:-8504} and on no other interface. Do not
    # widen PI_WEB_BIND_ADDRESS; pi-web itself is not a permission boundary.
    ports:
      - "${PI_WEB_BIND_ADDRESS:-127.0.0.1}:${PI_WEB_PORT:-8504}:8504"

    # -- environment ----------------------------------------------------------
    environment:
      # SearXNG search endpoint read by pi-web-access (web_search). Point at
      # the local service here, or an external instance.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      # Llama-swap URL (for dynamic model discovery).
      LLAMA_SWAP_URL: ${LLAMA_SWAP_URL:-}
      # Domains merged into the pi-sandbox baseline at startup.
      PROXY_ALLOWLIST: ${PROXY_ALLOWLIST:-}
      # CIDRs appended to the pi-web-access SSRF allow-ranges at startup.
      # The compose SearXNG sits on the pinned agent-net subnet, so its static
      # IP must be allowed through the SSRF guard.  In Kubernetes the public
      # SearXNG host needs no range.
      SSRF_ALLOW_RANGES: ${SSRF_ALLOW_RANGES:-172.28.0.10/32}
      # Optional HTTPS git credentials written to /home/agent/.git-credentials at startup.
      GIT_CREDENTIAL_URLS: ${GIT_CREDENTIAL_URLS:-}
      GIT_CREDENTIAL_PROTOCOL: ${GIT_CREDENTIAL_PROTOCOL:-https}
      GIT_CREDENTIAL_HOST: ${GIT_CREDENTIAL_HOST:-}
      GIT_CREDENTIAL_PATH: ${GIT_CREDENTIAL_PATH:-}
      GIT_CREDENTIAL_USERNAME: ${GIT_CREDENTIAL_USERNAME:-}
      GIT_CREDENTIAL_PASSWORD: ${GIT_CREDENTIAL_PASSWORD:-}
      # Pi Web web server port
      PI_WEB_PORT: ${PI_WEB_PORT:-8504}
      # Pi Web web server bind host. Must be 0.0.0.0 inside the container so
      # the published port can reach it.
      PI_WEB_HOST: ${PI_WEB_HOST:-0.0.0.0}

    # -- security -------------------------------------------------------------
    # The image default user is already uid 1001; stated here so the boundary is
    # visible in the deployment definition. No cap_add: nothing privileged runs
    # in this container.
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # seccomp:unconfined is currently required for two things: node-pty /
      # Pi Web terminal behaviour, and bwrap's namespace creation (clone3,
      # unshare) under pi-sandbox. On Kubernetes, an equivalent permissive
      # seccomp profile plus usable unprivileged user namespaces are required
      # (on AppArmor-enforcing nodes: a bwrap profile, or
      # kernel.apparmor_restrict_unprivileged_userns=0). The container
      # healthcheck fails if bwrap cannot create a sandbox.
      - seccomp:unconfined

    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # searxng - open-source metasearch engine
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    networks:
      agent-net:
        # Static address matching config/web-search.json ssrf.allowRanges, so
        # pi-web-access can reach SearXNG while the SSRF guard stays closed to
        # everything else private.
        ipv4_address: 172.28.0.10
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # llama-swap - dynamic LLM model swapping (disabled by default)
  # Start with: docker compose --profile llama-swap up
  # ---------------------------------------------------------------------------
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:latest
    container_name: llama-swap
    profiles:
      - llama-swap
    networks:
      - agent-net
    volumes:
      - ./config/llama-swap.yml:/app/config.yml:ro
      # llama.cpp writes one slot file per model and slot beneath this directory.
      # Retain it across container recreation so Pi can restore KV cache state.
      - llama-slot-cache:/app/kv-cache
    command: ["--config", "/app/config.yml"]
    restart: unless-stopped

# -- networks -----------------------------------------------------------------
networks:
  # Agent + internal dependencies. Egress-capable: the pi-sandbox broker and
  # the Pi process itself need direct egress; sandboxed Bash commands do NOT
  # (they get a private network namespace whose only exit is the broker's
  # policy proxy). Subnet is pinned so the SearXNG address in
  # config/web-search.json ssrf.allowRanges is stable. On Kubernetes, this
  # maps to a single Pod network with egress NetworkPolicy scoped per-pod,
  # not per-process; update ssrf.allowRanges to match the SearXNG Pod IP.
  agent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

# -- named volumes ------------------------------------------------------------
volumes:
  searxng-data:
    driver: local
  llama-slot-cache:
    driver: local
