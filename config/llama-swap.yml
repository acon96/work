# llama-swap configuration
# See https://github.com/mostlygeek/llama-swap for full options
# --------------------------------------------------------------

# Seconds to wait for llama.cpp to be available to serve requests
# Default (and minimum): 15 seconds
healthCheckTimeout: 300

# valid log levels: debug, info (default), warn, error
logLevel: info

includeAliasesInList: true

# shares loading progress as thinking content
sendLoadingState: true

macros:
  llama-cli: >
    /app/llama-server
      --port ${PORT}
      --flash-attn on
      --no-webui
      --metrics
      --jinja
      --threads 32

  10k: 10240
  16k: 16384
  32k: 32768
  40k: 40960
  64k: 65536
  100k: 102400
  128k: 131072
  168k: 172032 # 200k - 32k
  200k: 200000
  224k: 229376 # 256k - 32k
  256k: 262144

  # apparently k is more sensitive to quantization than v, so we can use a higher quality for v cache within the same memory budget
  k-cache-q8: --cache-type-k q8_0
  v-cache-q8: --cache-type-v q8_0
  k-cache-q4: --cache-type-k q4_0
  v-cache-q4: --cache-type-v q4_0
  spec-ngram: --spec-type ngram-mod --spec-ngram-mod-n-max 16

  batch-size-2048:  --batch-size 2048 --ubatch-size 2048
  batch-size-4096:  --batch-size 4096 --ubatch-size 4096
  batch-size-8192:  --batch-size 8192 --ubatch-size 8192
  context-shift: --context-shift
  auto-fit: --fit on

  split-tensor: --split-mode tensor
  split-layer: --split-mode layer
  split-row: --split-mode row

models:
  "qwen3.8-27b":
    cmd: >
      ${llama-cli}
        --model /app/models/Qwen/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q8_0.gguf
        --ctx-size ${256k}
        --batch-size 4096 --ubatch-size 1024
        ${k-cache-q8}
        ${v-cache-q8}
        ${draft-k-cache-q4}
        ${draft-v-cache-q4}
        ${split-tensor}
        ${spec-ngram-mtp}
        --temperature 1.0
        --top-p 0.95
        --top-k 20
        --min-p 0.0
        --presence-penalty 0.0
        --repeat-penalty 1.0
        --reasoning on
        --reasoning-preserve
    ttl: 1800
    metadata:
      context_len: ${256k}
      max_tokens: ${32k}
      thinking: true
      thinking_levels: [low, medium, xhigh]

  "qwen3.8-27b:instruct":
    cmd: >
      ${llama-cli}
        --model /app/models/Qwen/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q8_0.gguf
        --ctx-size ${256k}
        --batch-size 4096 --ubatch-size 1024
        ${k-cache-q8}
        ${v-cache-q8}
        ${draft-k-cache-q4}
        ${draft-v-cache-q4}
        ${split-tensor}
        ${spec-ngram-mtp}
        --temperature 0.7
        --top-p 0.80
        --top-k 20
        --min-p 0.0
        --presence-penalty 1.5
        --repeat-penalty 1.0
        --reasoning off
    ttl: 1800
    metadata:
      context_len: ${256k}
      max_tokens: ${32k}
      thinking: false