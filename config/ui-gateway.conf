# Pi Web UI gateway (nginx).
#
# `work` sits on an internal network so it has no route off-box, and Docker
# cannot publish a port on an internal network. This gateway is the single
# host-facing hop: it holds no agent state, no credentials, and no network
# path to the proxy or the Internet.
#
# Files in /etc/nginx/conf.d are included inside the `http` block, so the `map`
# below is legal here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Pi Web serves the workspace over a WebSocket and streams assistant output,
    # so buffering must stay off and the read timeout long.
    location / {
        proxy_pass http://work:8504;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }
}
