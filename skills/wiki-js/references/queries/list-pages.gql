# List all pages, ordered by title.
# Optional: bind $limit, $orderBy, $orderByDirection, $tags, $locale
query(
  $limit: Int
  $orderBy: PageOrderBy
  $orderByDirection: PageOrderByDirection
  $tags: [String!]
  $locale: String
) {
  pages {
    list(
      limit: $limit
      orderBy: $orderBy
      orderByDirection: $orderByDirection
      tags: $tags
      locale: $locale
    ) {
      id
      path
      locale
      title
      description
      contentType
      isPublished
      isPrivate
      createdAt
      updatedAt
      tags
    }
  }
}
